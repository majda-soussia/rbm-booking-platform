spring:
  application:
    name: rbm
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rbm_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

app:
  admin:
    email: ${ADMIN_EMAIL:admin@rbm.com}
    password: ${ADMIN_PASSWORD:Admin123!}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:rbm-dev-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}