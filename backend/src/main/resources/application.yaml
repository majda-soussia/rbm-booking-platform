spring:
  application:
    name: rbm
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rbm_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000   # sans ces délais, un SMTP injoignable bloque le fil d'envoi
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  admin:
    email: ${ADMIN_EMAIL:admin@rbm.com}
    password: ${ADMIN_PASSWORD:Admin123!}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:rbm-dev-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo-data: ${APP_DEMO_DATA:false}
  demo-client-password: ${DEMO_CLIENT_PASSWORD:}
  frontend-url: ${APP_BASE_URL:http://localhost:4200}
  verification:
    required: ${EMAIL_VERIFICATION_REQUIRED:true}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    brevo:
      api-key: ${BREVO_API_KEY:}