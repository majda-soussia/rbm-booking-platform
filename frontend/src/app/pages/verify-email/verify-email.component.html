<div class="container mt--8 pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card bg-secondary shadow border-0">
        <div class="card-body px-lg-5 py-lg-5 text-center" [ngSwitch]="etat">

          <p *ngSwitchCase="'chargement'" class="text-muted mb-0">Vérification en cours…</p>

          <ng-container *ngSwitchCase="'succes'">
            <i class="ni ni-check-bold text-success" style="font-size:3rem"></i>
            <h3 class="mt-3">Compte activé</h3>
            <p class="text-muted">{{ message }}</p>
            <a routerLink="/login" class="btn btn-primary mt-3">Se connecter</a>
          </ng-container>

          <ng-container *ngSwitchCase="'erreur'">
            <i class="ni ni-fat-remove text-danger" style="font-size:3rem"></i>
            <h3 class="mt-3">Vérification impossible</h3>
            <p class="text-muted">{{ message }}</p>
            <a routerLink="/login" class="btn btn-outline-primary mt-3">Retour à la connexion</a>
          </ng-container>

        </div>
      </div>
    </div>
  </div>
</div>
