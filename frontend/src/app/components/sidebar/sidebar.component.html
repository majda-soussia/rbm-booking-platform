<nav class="navbar navbar-vertical fixed-left navbar-expand-md navbar-light bg-white" id="sidenav-main">
  <div class="container-fluid">

    <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed"
            aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <a class="navbar-brand pt-0" [routerLink]="['/dashboard']">
      <img src="./assets/img/brand/blue.png" class="navbar-brand-img" alt="RBM">
    </a>

    <div class="collapse navbar-collapse" [ngbCollapse]="isCollapsed" id="sidenav-collapse-main">

      <div class="navbar-collapse-header d-md-none">
        <div class="row">
          <div class="col-6 collapse-brand">
            <a [routerLink]="['/dashboard']"><img src="./assets/img/brand/blue.png" alt="RBM"></a>
          </div>
          <div class="col-6 collapse-close">
            <button type="button" class="navbar-toggler" (click)="isCollapsed = !isCollapsed">
              <span></span><span></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Liens du menu -->
      <ul class="navbar-nav">
        <li *ngFor="let menuItem of menuItems" class="nav-item">
          <a routerLinkActive="active" [routerLink]="[menuItem.path]" class="nav-link">
            <i class="ni {{ menuItem.icon }}"></i>
            {{ menuItem.title }}
          </a>
        </li>
      </ul>

      <!-- Déconnexion -->
      <hr class="my-3">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link logout-link" href="javascript:void(0)" (click)="logout()">
            <i class="ni ni-user-run text-danger"></i>
            Déconnexion
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
